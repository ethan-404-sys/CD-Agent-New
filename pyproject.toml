[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-agent"
version = "0.2.0"
description = "Closed-loop verification-driven change detection agent"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cd_agent*"]
